[package]
name = "monitor-embed-check"
description = "Proves an editor crate can embed MonitorPane: its own .slint window, the macro glue, DEP_CTRL_MONITOR_SLINT_UI"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
publish.workspace = true

[dependencies]
ctrl-monitor = { path = "../../crates/ctrl-monitor" }
ctrl-monitor-slint = { path = "../../crates/ctrl-monitor-slint" }
slint = "1"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
