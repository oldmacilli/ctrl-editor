[package]
name = "korg-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# Keep the standard renderers and accessibility, but omit the unused tray.
slint = { version = "1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
rfd = "0.15"
korg-core.workspace = true
korg-app.workspace = true
korg-storage = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
korg-midi.workspace = true
korg-midi-midir.workspace = true
korg-devices.workspace = true
korg-format.workspace = true
korg-model.workspace = true
korg-sysex.workspace = true

[build-dependencies]
slint-build = "1"
