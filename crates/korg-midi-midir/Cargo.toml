[package]
name = "korg-midi-midir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Platform MIDI adapter: ctrl-midi with the backend chosen at run time"

[dependencies]
korg-midi.workspace = true
ctrl-midi.workspace = true
# Only for the long-lived port-listing clients on the native backend
# (ctrl-midi builds new clients per scan); the same midir ctrl-midi uses.
midir = "0.10"

[dev-dependencies]
ctrl-codec.workspace = true
ctrl-descriptors.workspace = true
korg-devices.workspace = true
korg-sysex.workspace = true
