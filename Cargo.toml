[workspace]
resolver = "2"
members = ["crates/ctrl-cdl", "crates/ctrl-codec", "crates/ctrl-engine", "crates/ctrl-descriptors", "crates/ctrl-midi", "crates/ctrl-monitor", "crates/ctrl-monitor-midi", "crates/ctrl-monitor-slint", "crates/ctrl-monitor-tui", "tools/ctrl-cli", "tools/monitor-embed-check", "tools/cdl-queries"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
kdl = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrl-cdl = { path = "crates/ctrl-cdl" }
ctrl-codec = { path = "crates/ctrl-codec" }
ctrl-engine = { path = "crates/ctrl-engine" }

# The tree-sitter C library compiles queries slowly unoptimised
# (tools/cdl-queries tests).
[profile.dev.package.tree-sitter]
opt-level = 2
[profile.dev.package.tree-sitter-kdl]
opt-level = 2
